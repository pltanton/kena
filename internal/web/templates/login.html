{{define "title"}}Log in · kena{{end}}
{{define "main"}}<h1>Log in</h1>
<p class="muted">Log in to keep your progress on every device. Your username and passphrase come from whoever runs this kena.</p>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form class="card stack" method="post" action="/login">
<input type="hidden" name="next" value="{{.Next}}">
<label for="username">Username</label>
<input id="username" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required{{if not .Username}} autofocus{{end}}>
<label for="passphrase">Passphrase</label>
<div class="pass"><input id="passphrase" name="passphrase" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required{{if .Username}} autofocus{{end}}><button type="button" class="reveal" aria-controls="passphrase" aria-pressed="false" aria-label="Show passphrase" hidden>Show</button></div>
<button type="submit">Log in</button>
</form>
{{end}}
