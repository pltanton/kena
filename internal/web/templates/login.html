{{define "title"}}{{t "login.title"}} · kena{{end}}
{{define "main"}}<h1>{{t "login.title"}}</h1>
<p class="muted">{{t "login.lede"}}</p>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
{{- if .SSO}}
<p><a class="button sso" href="{{.SSOURL}}">{{tf "login.sso" .SSO}}</a></p>
<p class="login-or">{{t "login.with_passphrase"}}</p>
{{- end}}
<form class="card stack" method="post" action="/login">
<input type="hidden" name="next" value="{{.Next}}">
<label for="username">{{t "login.username"}}</label>
<input id="username" name="username" value="{{.Username}}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required{{if not .Username}} autofocus{{end}}>
<label for="passphrase">{{t "login.passphrase"}}</label>
<div class="pass"><input id="passphrase" name="passphrase" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required{{if .Username}} autofocus{{end}}><button type="button" class="reveal" aria-controls="passphrase" aria-pressed="false" aria-label="{{t "pass.show_label"}}" hidden>{{t "pass.show"}}</button></div>
<button type="submit">{{t "login.submit"}}</button>
</form>
{{end}}
