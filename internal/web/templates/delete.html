{{define "title"}}Delete {{.Title}} · kena{{end}}
{{define "main"}}<h1>Delete deck</h1>
<div class="card confirm">
<p>Delete <strong>{{.Title}}</strong> and its {{.TaskCount}} {{if eq .TaskCount 1}}task{{else}}tasks{{end}}? This removes everyone's progress on it.</p>
<form method="post" action="/s/{{.Slug}}/delete">
<button type="submit" class="danger">Delete deck</button>
</form>
<a class="button secondary" href="/s/{{.Slug}}">Cancel</a>
</div>
{{end}}
