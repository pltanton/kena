{{define "title"}}Reset progress · kena{{end}}
{{define "main"}}<h1>Reset progress</h1>
<div class="card confirm">
<p>Reset your progress on <strong>{{.Title}}</strong>? Your answers here will be cleared (mistakes history too).</p>
<form method="post" action="/s/{{.Slug}}/reset">
<button type="submit" class="danger">Reset progress</button>
</form>
<a class="button secondary" href="/s/{{.Slug}}">Cancel</a>
</div>
{{end}}
