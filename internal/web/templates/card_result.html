{{define "card_result"}}{{template "bar" .Bar}}
<div class="card result {{if .Correct}}ok{{else}}bad{{end}}">
{{- if .Correct}}
<p class="verdict"><span class="tick" aria-label="Correct">✓</span>{{if ge .Streak 2}} <span class="streak">🔥 {{.Streak}} in a row</span>{{end}}</p>
{{- end}}
<p class="sentence" lang="el">{{template "sentence" .Task}}</p>
{{- if not .Correct}}
{{with .Explanation}}<p class="explanation">{{.}}</p>{{end}}
{{- end}}
<button type="button" data-next hx-get="{{.NextURL}}" hx-target="#card" hx-swap="innerHTML">Next</button>
</div>{{end}}
